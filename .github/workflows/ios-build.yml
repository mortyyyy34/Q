name: NOX STAR iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find NOX STAR ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: NOX STAR ZIP not found"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          mkdir -p nox_project

          unzip -q "$ZIP_FILE" -d nox_project

          PROJECT=$(find nox_project \
            -type f \
            -name "project.godot" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot not found"

            find nox_project -maxdepth 4 -type f | head -100

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project:"
          echo "$PROJECT_DIR"


      - name: Download Godot
        shell: bash
        run: |
          set -e

          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_macos.universal.zip"

          mkdir -p /tmp/godot

          unzip -q /tmp/godot.zip -d /tmp/godot

          mkdir -p "$HOME/bin"

          cp \
            "/tmp/godot/Godot.app/Contents/MacOS/Godot" \
            "$HOME/bin/godot"

          chmod +x "$HOME/bin/godot"

          "$HOME/bin/godot" --version


      - name: Download iOS export template
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable"

          curl -L --fail --retry 3 \
            -o /tmp/ios.zip \
            "https://github.com/asdrome/godot-individual-export-templates/releases/download/v4.5.1-stable/ios.zip"

          cp \
            /tmp/ios.zip \
            "$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable/ios.zip"

          echo "iOS template installed"

          ls -lh \
            "$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable/ios.zip"


      - name: Create iOS export preset
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          application/targeted_device_family=2

          application/bundle_identifier="com.noxstar.game"

          application/short_version="1.0"
          application/version="1.0"

          application/export_method_debug=0
          application/export_method_release=0

          application/export_project_only=true

          application/delete_old_export_files_unconditionally=true

          architectures/arm64=true

          capabilities/access_wifi=true

          capabilities/push_notifications=false

          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false
          EOF

          echo "Created export_presets.cfg"

          cat "$PROJECT_DIR/export_presets.cfg"


      - name: Check Godot project
        shell: bash
        run: |
          set -e

          "$HOME/bin/godot" \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit-after 3


      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -e

          rm -rf build

          mkdir -p build/ios

          "$HOME/bin/godot" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "iOS" \
            "$GITHUB_WORKSPACE/build/ios/NOXSTAR.xcodeproj"

          echo "Export finished"

          find build/ios \
            -maxdepth 4 \
            -type f \
            | head -100


      - name: Find Xcode project
        shell: bash
        run: |
          set -e

          XCODEPROJ=$(find build/ios \
            -maxdepth 3 \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: Xcode project was not created"

            find build/ios \
              -maxdepth 5 \
              -type f

            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

          echo "Xcode project:"
          echo "$XCODEPROJ"


      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -e

          PROJECT_NAME=$(basename "$XCODEPROJ" .xcodeproj)

          echo "Project: $PROJECT_NAME"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$PROJECT_NAME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      
      - name: Locate NOX STAR app
        shell: bash
        run: |
          set -e

          APP=$(find build/derived/Build/Products \
            -type d \
            -name "*.app" \
            -path "*iphoneos*" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: NOX STAR .app not found"

            find build/derived \
              -maxdepth 7 \
              -type d \
              -name "*.app"

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "NOX STAR app:"
          echo "$APP"


      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf build/ipa

          mkdir -p build/ipa/Payload

          cp -R "$APP" build/ipa/Payload/NOXSTAR.app

          cd build/ipa

          zip -qry NOX_STAR_UNSIGNED.ipa Payload

          echo "IPA:"
          ls -lh NOX_STAR_UNSIGNED.ipa


      - name: Upload NOX STAR IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOX-STAR-iOS-UNSIGNED
          path: build/ipa/NOX_STAR_UNSIGNED.ipa
          retention-days: 7
