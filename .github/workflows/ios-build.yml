name: NOX STAR iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack NOX STAR ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "NOX STAR ZIP not found"
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          mkdir -p nox_project
          unzip -q "$ZIP_FILE" -d nox_project

          PROJECT=$(find nox_project -name project.godot -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "project.godot not found"
            find nox_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Download Godot
        shell: bash
        run: |
          set -e

          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_macos.universal.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          mkdir -p "$HOME/bin"
          cp /tmp/godot/Godot.app/Contents/MacOS/Godot "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"

          "$HOME/bin/godot" --version

      - name: Download Godot export templates
        shell: bash
        run: |
          set -e

          curl -L --fail --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz

          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable"

          unzip -q /tmp/templates.tpz -d /tmp/templates

          find /tmp/templates -type f -name 'ios.zip' -exec cp {} \
            "$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable/" \;

      - name: Check Godot project
        shell: bash
        run: |
          "$HOME/bin/godot" \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit-after 2

      - name: Export iOS project
        shell: bash
        run: |
          set -e

          mkdir -p build/ios

          "$HOME/bin/godot" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "iOS" \
            "$GITHUB_WORKSPACE/build/ios"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -e

          XCODEPROJ=$(find build/ios -maxdepth 2 -name '*.xcodeproj' | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "Xcode project was not generated."
            find build/ios -maxdepth 4 -type f
            exit 1
          fi

          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP=$(find build/derived/Build/Products \
            -type d \
            -name '*.app' \
            -path '*iphoneos*' | head -n 1)

          if [ -z "$APP" ]; then
            echo "NOX STAR .app was not produced."
            exit 1
          fi

          mkdir -p build/output
          ditto "$APP" build/output/NOX_STAR.app

          cd build/output
          zip -qry NOX_STAR_UNSIGNED_APP.zip NOX_STAR.app

      - name: Upload NOX STAR app
        uses: actions/upload-artifact@v4
        with:
          name: NOX-STAR-iOS
          path: build/output/NOX_STAR_UNSIGNED_APP.zip
          retention-days: 7
