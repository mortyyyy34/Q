name: NOX STAR iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack NOX STAR project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: NOX STAR ZIP not found"
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          mkdir -p nox_project

          unzip -q "$ZIP_FILE" -d nox_project

          PROJECT="$(find nox_project -type f -name 'project.godot' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot not found"

            find nox_project -maxdepth 5 -type f | head -100

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project:"
          echo "$PROJECT_DIR"

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail --retry 5 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_macos.universal.zip"

          rm -rf /tmp/godot

          mkdir -p /tmp/godot

          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT="/tmp/godot/Godot.app/Contents/MacOS/Godot"

          if [ ! -x "$GODOT" ]; then
            echo "ERROR: Godot executable not found"

            find /tmp/godot -maxdepth 5 -type f | head -100

            exit 1
          fi

          echo "Godot executable:"
          echo "$GODOT"

          "$GODOT" --headless --version

          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Download official Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading official Godot 4.5.1 export templates..."

          curl -L --fail --retry 5 \
            -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"

          echo "Export templates downloaded:"
          ls -lh /tmp/templates.tpz

      - name: Install official iOS export template
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable"

          rm -rf /tmp/templates

          mkdir -p /tmp/templates

          unzip -q /tmp/templates.tpz -d /tmp/templates

          echo "Searching official template package for ios.zip..."

          IOS_TEMPLATE="$(find /tmp/templates \
            -type f \
            -name 'ios.zip' \
            | head -n 1)"

          if [ -z "$IOS_TEMPLATE" ]; then
            echo "ERROR: ios.zip was not found inside the official export templates package."

            echo "Package contents:"
            find /tmp/templates \
              -maxdepth 5 \
              -type f \
              | head -200

            exit 1
          fi

          mkdir -p "$TEMPLATE_DIR"

          cp "$IOS_TEMPLATE" "$TEMPLATE_DIR/ios.zip"

          echo "iOS template installed:"
          ls -lh "$TEMPLATE_DIR/ios.zip"

      - name: Create iOS export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""

          [preset.0.options]

          application/app_store_team_id="0000000000"
          application/bundle_identifier="com.noxstar.game"
          application/short_version="1.0"
          application/version="1.0"

          architectures/arm64=true

          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false

          application/export_project_only=true
          EOF

          echo "iOS export preset:"
          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT" \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit-after 3

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          mkdir -p build/ios

          echo "Exporting NOX STAR to iOS..."

          "$GODOT" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "iOS" \
            "$GITHUB_WORKSPACE/build/ios/NOXSTAR.zip"

          if [ ! -f "$GITHUB_WORKSPACE/build/ios/NOXSTAR.zip" ]; then
            echo "ERROR: Godot did not create NOXSTAR.zip"

            find build/ios \
              -maxdepth 5 \
              -type f \
              | head -200

            exit 1
          fi

          echo "iOS Xcode export created:"
          ls -lh "$GITHUB_WORKSPACE/build/ios/NOXSTAR.zip"

      - name: Unpack generated Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/xcode

          unzip -q \
            build/ios/NOXSTAR.zip \
            -d build/xcode

          XCODEPROJ="$(find build/xcode \
            -type d \
            -name '*.xcodeproj' \
            | head -n 1)"

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: Xcode project was not generated."

            find build/xcode \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

          echo "Xcode project:"
          echo "$XCODEPROJ"

      - name: Find Xcode scheme
        shell: bash
        run: |
          set -euo pipefail

          SCHEME="$(
            find "$XCODEPROJ" \
              -type f \
              -name '*.xcscheme' \
              | head -n 1 \
              | sed 's/.*\///' \
              | sed 's/\.xcscheme$//'
          )"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Xcode scheme not found"

            find build/xcode \
              -name '*.xcscheme'

            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Xcode scheme:"
          echo "$SCHEME"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/derived

          echo "Building unsigned NOX STAR iOS app..."

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Locate NOX STAR app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find build/derived/Build/Products \
              -type d \
              -name '*.app' \
              -path '*iphoneos*' \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: NOX STAR .app not found"

            find build/derived \
              -type d \
              -name '*.app'

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "NOX STAR app:"
          echo "$APP"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/ipa

          mkdir -p build/ipa/Payload

          cp -R \
            "$APP" \
            build/ipa/Payload/NOXSTAR.app

          cd build/ipa

          zip -qry \
            NOX_STAR_UNSIGNED.ipa \
            Payload

          echo "Unsigned IPA created:"

          ls -lh NOX_STAR_UNSIGNED.ipa

      - name: Upload NOX STAR IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOX-STAR-iOS-UNSIGNED
          path: build/ipa/NOX_STAR_UNSIGNED.ipa
          retention-days: 7
