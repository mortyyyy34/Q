name: Build NOX STAR for iOS

on:
  workflow_dispatch:
    inputs:
      apple_team_id:
        description: "Apple Team ID (10 characters)"
        required: true
        type: string

jobs:
  build-ios:
    name: NOX STAR iOS
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # FIND PROJECT
      # ------------------------------------------------------------

      - name: Find NOX STAR project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ZIP..."

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              ! -path '*/build/*' \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: NOX STAR ZIP not found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/nox_project"

          mkdir -p "$GITHUB_WORKSPACE/nox_project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/nox_project"

          PROJECT_FILE="$(
            find "$GITHUB_WORKSPACE/nox_project" \
              -type f \
              -name 'project.godot' \
              | head -n 1
          )"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found."

            find "$GITHUB_WORKSPACE/nox_project" \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "NOX STAR PROJECT:"
          echo "$PROJECT_DIR"

      # ------------------------------------------------------------
      # APPLE TEAM ID
      # ------------------------------------------------------------

      - name: Validate Apple Team ID
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "ERROR: Apple Team ID is empty."
            exit 1
          fi

          if ! [[ "$APPLE_TEAM_ID" =~ ^[A-Za-z0-9]{10}$ ]]; then
            echo "ERROR: Apple Team ID must contain exactly 10 letters/numbers."
            echo "Received length: ${#APPLE_TEAM_ID}"
            exit 1
          fi

          echo "Apple Team ID format: OK"

      # ------------------------------------------------------------
      # XCODE
      # ------------------------------------------------------------

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            --switch \
            /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

          echo
          echo "Developer directory:"
          xcode-select -p

          echo
          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      # ------------------------------------------------------------
      # GODOT
      # ------------------------------------------------------------

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_macos.universal.zip"

          curl \
            --location \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o /tmp/godot.zip \
            "$URL"

          rm -rf /tmp/godot

          mkdir -p /tmp/godot

          unzip -q \
            /tmp/godot.zip \
            -d /tmp/godot

          GODOT_BIN="/tmp/godot/Godot.app/Contents/MacOS/Godot"

          if [ ! -x "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found."
            exit 1
          fi

          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" \
            --headless \
            --version

      # ------------------------------------------------------------
      # EXPORT TEMPLATES
      # ------------------------------------------------------------

      - name: Download official export templates
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"

          curl \
            --location \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            -o /tmp/godot_templates.tpz \
            "$URL"

      - name: Install iOS template
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_ROOT="$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable"

          rm -rf /tmp/godot_templates

          mkdir -p /tmp/godot_templates
          mkdir -p "$TEMPLATE_ROOT"

          unzip -q \
            /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          IOS_TEMPLATE="$(
            find /tmp/godot_templates \
              -type f \
              -name 'ios.zip' \
              | head -n 1
          )"

          if [ -z "$IOS_TEMPLATE" ]; then
            echo "ERROR: ios.zip not found."
            exit 1
          fi

          cp \
            "$IOS_TEMPLATE" \
            "$TEMPLATE_ROOT/ios.zip"

          echo "iOS template installed."

      # ------------------------------------------------------------
      # CREATE PRESET
      # ------------------------------------------------------------

      - name: Create iOS export preset
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        run: |
          set -euo pipefail

          cat > "$PROJECT_DIR/export_presets.cfg" <<EOF
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          patch_delta_encoding=false
          patch_delta_compression_level_zstd=19
          patch_delta_min_reduction=0.1
          patch_delta_include_filters="*"
          patch_delta_exclude_filters="*"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          architectures/arm64=true

          application/app_store_team_id="$APPLE_TEAM_ID"

          application/bundle_identifier="com.noxstar.game"

          application/short_version="1.0"
          application/version="1.0.0"

          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""

          application/provisioning_profile_specifier_debug=""
          application/provisioning_profile_specifier_release=""

          application/export_method_debug=1
          application/export_method_release=0

          application/export_project_only=true

          application/delete_old_export_files_unconditionally=true

          application/targeted_device_family=1

          application/min_ios_version="14.0"

          capabilities/access_wifi=true
          capabilities/push_notifications=false
          capabilities/performance_gaming_tier=true
          capabilities/performance_a12=true
          capabilities/additional=PackedStringArray()

          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false

          privacy/camera_usage_description=""
          privacy/microphone_usage_description=""
          privacy/photolibrary_usage_description=""

          privacy/camera_usage_description_localized={}
          privacy/microphone_usage_description_localized={}
          privacy/photolibrary_usage_description_localized={}

          shader_baker/enabled=false
          EOF

          echo "Preset created."

      # ------------------------------------------------------------
      # CLEAN GODOT IMPORT CACHE
      # ------------------------------------------------------------

      - name: Clean Godot generated data
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing generated Godot state..."

          rm -rf \
            "$PROJECT_DIR/.godot"

          find "$PROJECT_DIR" \
            -type d \
            -name ".godot" \
            -prune \
            -exec rm -rf {} +

          echo "Clean complete."

      # ------------------------------------------------------------
      # IMPORT FIRST
      # ------------------------------------------------------------

      - name: Import all Godot resources
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "IMPORTING GODOT RESOURCES"
          echo "========================================"

          "$GODOT" \
            --headless \
            --path "$PROJECT_DIR" \
            --import

          echo
          echo "Godot resource import completed."

      # ------------------------------------------------------------
      # VERIFY IMPORT STABILITY
      # ------------------------------------------------------------

      - name: Verify imported filesystem is stable
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking filesystem stability..."

          HASH1="$(
            find "$PROJECT_DIR/.godot" \
              -type f \
              -print0 \
              2>/dev/null \
              | sort -z \
              | xargs -0 shasum 2>/dev/null \
              | shasum \
              || true
          )"

          sleep 3

          HASH2="$(
            find "$PROJECT_DIR/.godot" \
              -type f \
              -print0 \
              2>/dev/null \
              | sort -z \
              | xargs -0 shasum 2>/dev/null \
              | shasum \
              || true
          )"

          echo "HASH 1:"
          echo "$HASH1"

          echo
          echo "HASH 2:"
          echo "$HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo
            echo "ERROR: Godot filesystem is still changing."
            echo "Waiting and checking one more time..."

            sleep 5

            HASH3="$(
              find "$PROJECT_DIR/.godot" \
                -type f \
                -print0 \
                2>/dev/null \
                | sort -z \
                | xargs -0 shasum 2>/dev/null \
                | shasum \
                || true
            )

            if [ "$HASH2" != "$HASH3" ]; then
              echo "ERROR: Filesystem did not stabilize."
              exit 1
            fi
          fi

          echo
          echo "Filesystem stable."

      # ------------------------------------------------------------
      # GODOT PROJECT VALIDATION
      # ------------------------------------------------------------

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT" \
            --headless \
            --path "$PROJECT_DIR" \
            --check-only

          echo "Godot syntax/project validation: OK"

      # ------------------------------------------------------------
      # EXPORT XCODE PROJECT
      # ------------------------------------------------------------

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p \
            "$GITHUB_WORKSPACE/build/ios"

          IOS_EXPORT_DIR="$GITHUB_WORKSPACE/build/ios/NOXSTAR"

          mkdir -p "$IOS_EXPORT_DIR"

          echo "========================================"
          echo "EXPORTING IOS XCODE PROJECT"
          echo "========================================"

          echo "Destination:"
          echo "$IOS_EXPORT_DIR"

          "$GODOT" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "iOS" \
            "$IOS_EXPORT_DIR"

          echo
          echo "iOS export completed."

      # ------------------------------------------------------------
      # FIND XCODE PROJECT
      # ------------------------------------------------------------

      - name: Find generated Xcode project
        shell: bash
        run: |
          set -euo pipefail

          XCODEPROJ="$(
            find "$GITHUB_WORKSPACE/build/ios" \
              -type d \
              -name '*.xcodeproj' \
              | head -n 1
          )"

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: Xcode project not found."

            find "$GITHUB_WORKSPACE/build/ios" \
              -maxdepth 8 \
              -print

            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$XCODEPROJ"

      # ------------------------------------------------------------
      # FIND SCHEME
      # ------------------------------------------------------------

      - name: Find Xcode scheme
        shell: bash
        run: |
          set -euo pipefail

          SCHEME="$(
            find "$XCODEPROJ" \
              -type f \
              -name '*.xcscheme' \
              | head -n 1 \
              | sed 's/.*\///' \
              | sed 's/\.xcscheme$//'
          )"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Xcode scheme not found."
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Scheme:"
          echo "$SCHEME"

      # ------------------------------------------------------------
      # BUILD UNSIGNED APP
      # ------------------------------------------------------------

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/build/derived"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ------------------------------------------------------------
      # CREATE IPA
      # ------------------------------------------------------------

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find "$GITHUB_WORKSPACE/build/derived/Build/Products" \
              -type d \
              -name '*.app' \
              -path '*iphoneos*' \
              | head -n 1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: .app not found."

            find "$GITHUB_WORKSPACE/build/derived" \
              -type d \
              -name '*.app'

            exit 1
          fi

          echo "APP:"
          echo "$APP"

          rm -rf \
            "$GITHUB_WORKSPACE/build/ipa"

          mkdir -p \
            "$GITHUB_WORKSPACE/build/ipa/Payload"

          cp -R \
            "$APP" \
            "$GITHUB_WORKSPACE/build/ipa/Payload/NOXSTAR.app"

          cd "$GITHUB_WORKSPACE/build/ipa"

          zip \
            -qry \
            NOX_STAR_UNSIGNED.ipa \
            Payload

          echo
          echo "IPA:"
          ls -lh NOX_STAR_UNSIGNED.ipa

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOX-STAR-iOS-UNSIGNED
          path: build/ipa/NOX_STAR_UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: NOX-STAR-XCODE-PROJECT
          path: build/ios/NOXSTAR
          if-no-files-found: error
          retention-days: 7
